name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
          - os: windows-latest
            rid: win-arm64
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            ext: ""
          - os: ubuntu-latest
            rid: linux-arm64
            ext: ""
          - os: macos-latest
            rid: osx-x64
            ext: ""
          - os: macos-latest
            rid: osx-arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AgentFederation.sln

      - name: Test
        run: dotnet test AgentFederation.sln --configuration Release --no-restore --verbosity minimal

      - name: Publish relay
        run: >
          dotnet publish src/Federation.Relay/Federation.Relay.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/relay

      - name: Publish CLI
        run: >
          dotnet publish src/Federation.Cli/Federation.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/cli

      - name: Publish MCP Server
        run: >
          dotnet publish src/Federation.Node.McpServer/Federation.Node.McpServer.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/mcp

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/relay/federation-relay.exe -DestinationPath dist/federation-relay-${{ matrix.rid }}.zip
          Compress-Archive -Path publish/cli/federation.exe           -DestinationPath dist/federation-${{ matrix.rid }}.zip
          Compress-Archive -Path publish/mcp/federation-mcp.exe      -DestinationPath dist/federation-mcp-${{ matrix.rid }}.zip

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" build.keychain
          rm /tmp/cert.p12

      - name: Sign binaries (macOS)
        if: runner.os == 'macOS'
        env:
          CODESIGN_KEY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          chmod +x publish/relay/federation-relay publish/cli/federation publish/mcp/federation-mcp
          codesign --force --sign "$CODESIGN_KEY" --options runtime publish/relay/federation-relay
          codesign --force --sign "$CODESIGN_KEY" --options runtime publish/cli/federation
          codesign --force --sign "$CODESIGN_KEY" --options runtime publish/mcp/federation-mcp

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          zip -j dist/federation-relay-${{ matrix.rid }}.zip publish/relay/federation-relay
          zip -j dist/federation-${{ matrix.rid }}.zip       publish/cli/federation
          zip -j dist/federation-mcp-${{ matrix.rid }}.zip   publish/mcp/federation-mcp
          if [ "$RUNNER_OS" != "macOS" ]; then
            chmod +x publish/relay/federation-relay publish/cli/federation publish/mcp/federation-mcp
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.rid }}
          path: dist/

  build-installer-mac:
    name: Build installer (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Install MAUI workload
        run: dotnet workload install maui-maccatalyst

      - name: Get version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then VERSION="1.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" build.keychain
          rm /tmp/cert.p12

      - name: Publish MAUI (macCatalyst)
        run: >
          dotnet publish src/Federation.App.Maui/Federation.App.Maui.csproj
          -f net9.0-maccatalyst
          -c Release
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}
          -p:ApplicationVersion=1
          -p:EnableCodeSigning=false
          -p:EnableWindowsTargeting=true
          --output publish/installer-mac

      - name: Extract .app from .pkg, sign, and create .dmg
        env:
          CODESIGN_KEY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          PKG=$(find publish/installer-mac -name "*.pkg" | head -1)
          echo "Found pkg: $PKG"

          # Expand the flat pkg and extract the cpio payload
          mkdir -p pkg_payload
          pkgutil --expand "$PKG" pkg_expanded
          PAYLOAD=$(find pkg_expanded -name "Payload" | head -1)
          echo "Payload: $PAYLOAD"
          cd pkg_payload
          cat "$OLDPWD/$PAYLOAD" | gunzip -c | cpio -id 2>/dev/null || true
          cd "$OLDPWD"

          APP=$(find pkg_payload -name "*.app" | head -1)
          echo "Extracted app: $APP"
          if [ -z "$APP" ]; then
            echo "Contents of pkg_payload:"
            find pkg_payload
            exit 1
          fi

          # Deep-sign the .app bundle
          codesign --deep --force --verify --verbose \
            --sign "$CODESIGN_KEY" \
            --options runtime \
            "$APP"

          # Package into DMG
          mkdir -p dist dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Agent Federation" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            dist/AgentFederation-mac.dmg
          rm -rf dmg_staging pkg_expanded pkg_payload

          # Sign the DMG itself
          codesign --sign "$CODESIGN_KEY" dist/AgentFederation-mac.dmg

      - name: Notarize .dmg
        env:
          APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/AgentFederation-mac.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple dist/AgentFederation-mac.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/

  build-installer-windows:
    name: Build installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows wasm-tools

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+') { $version = '1.0.0' }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish MAUI (Windows)
        run: >
          dotnet publish src/Federation.App.Maui/Federation.App.Maui.csproj
          -f net9.0-windows10.0.19041.0
          -c Release
          -p:WindowsPackageType=None
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}
          -p:ApplicationVersion=1
          --output publish/installer-win

      - name: Rename exe to AgentFederation
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish/installer-win -Filter "*.exe" | Select-Object -First 1
          if ($exe.Name -ne "AgentFederation.exe") {
            Rename-Item $exe.FullName "AgentFederation.exe"
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            "/DSourceDir=${{ github.workspace }}\publish\installer-win" `
            install\AgentFederation.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/

  release:
    name: Create GitHub Release
    needs: [build, build-installer-mac, build-installer-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          body: |
            ## Agent Federation ${{ github.ref_name }}

            ### Download

            | Platform | Installer |
            |---|---|
            | macOS | [AgentFederation-mac.dmg](../../releases/download/${{ github.ref_name }}/AgentFederation-mac.dmg) |
            | Windows | [AgentFederation-win-setup.exe](../../releases/download/${{ github.ref_name }}/AgentFederation-win-setup.exe) |

            The installer registers your device, downloads the MCP server, and configures Claude Code or Claude Desktop automatically. No terminal needed.

            ### Advanced / server binaries

            | Platform | Relay (server) | CLI | MCP Server |
            |---|---|---|---|
            | Windows x64 | `federation-relay-win-x64.zip` | `federation-win-x64.zip` | `federation-mcp-win-x64.zip` |
            | Windows ARM64 | `federation-relay-win-arm64.zip` | `federation-win-arm64.zip` | `federation-mcp-win-arm64.zip` |
            | macOS Intel | `federation-relay-osx-x64.zip` | `federation-osx-x64.zip` | `federation-mcp-osx-x64.zip` |
            | macOS Apple Silicon | `federation-relay-osx-arm64.zip` | `federation-osx-arm64.zip` | `federation-mcp-osx-arm64.zip` |
            | Linux x64 | `federation-relay-linux-x64.zip` | `federation-linux-x64.zip` | `federation-mcp-linux-x64.zip` |
            | Linux ARM64 | `federation-relay-linux-arm64.zip` | `federation-linux-arm64.zip` | `federation-mcp-linux-arm64.zip` |

            > **No .NET installation required.** All binaries are self-contained.
