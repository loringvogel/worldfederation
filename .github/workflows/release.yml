name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
          - os: windows-latest
            rid: win-arm64
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            ext: ""
          - os: ubuntu-latest
            rid: linux-arm64
            ext: ""
          - os: macos-latest
            rid: osx-x64
            ext: ""
          - os: macos-latest
            rid: osx-arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AgentFederation.sln

      - name: Test
        run: dotnet test AgentFederation.sln --configuration Release --no-restore --verbosity minimal

      - name: Publish relay
        run: >
          dotnet publish src/Federation.Relay/Federation.Relay.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/relay

      - name: Publish CLI
        run: >
          dotnet publish src/Federation.Cli/Federation.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/cli

      - name: Publish MCP Server
        run: >
          dotnet publish src/Federation.Node.McpServer/Federation.Node.McpServer.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/mcp

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/relay/federation-relay.exe -DestinationPath dist/federation-relay-${{ matrix.rid }}.zip
          Compress-Archive -Path publish/cli/federation.exe           -DestinationPath dist/federation-${{ matrix.rid }}.zip
          Compress-Archive -Path publish/mcp/federation-mcp.exe      -DestinationPath dist/federation-mcp-${{ matrix.rid }}.zip

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          zip -j dist/federation-relay-${{ matrix.rid }}.zip publish/relay/federation-relay
          zip -j dist/federation-${{ matrix.rid }}.zip       publish/cli/federation
          zip -j dist/federation-mcp-${{ matrix.rid }}.zip   publish/mcp/federation-mcp
          chmod +x publish/relay/federation-relay publish/cli/federation publish/mcp/federation-mcp

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.rid }}
          path: dist/

  build-installer-mac:
    name: Build installer (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-maccatalyst

      - name: Publish MAUI (macCatalyst)
        run: >
          dotnet publish src/Federation.App.Maui/Federation.App.Maui.csproj
          -f net9.0-maccatalyst
          -c Release
          -p:ApplicationDisplayVersion=1.0
          -p:ApplicationVersion=1
          -p:CodesignKey="-"
          -p:EnableCodeSigning=true
          --output publish/installer-mac

      - name: Package .app as zip
        run: |
          mkdir -p dist
          APP=$(find publish/installer-mac -name "*.app" | head -1)
          cd publish/installer-mac
          zip -r ../../dist/AgentFederation-mac.zip "$(basename "$APP")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/

  build-installer-windows:
    name: Build installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Publish MAUI (Windows)
        run: >
          dotnet publish src/Federation.App.Maui/Federation.App.Maui.csproj
          -f net9.0-windows10.0.19041.0
          -c Release
          -p:WindowsPackageType=None
          -p:ApplicationDisplayVersion=1.0
          -p:ApplicationVersion=1
          --output publish/installer-win

      - name: Package as zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem publish/installer-win -Filter "*.exe" | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath dist/AgentFederation-win.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/

  release:
    name: Create GitHub Release
    needs: [build, build-installer-mac, build-installer-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          body: |
            ## Agent Federation ${{ github.ref_name }}

            ### Setup App (recommended for new users)

            | Platform | Download |
            |---|---|
            | macOS | [`AgentFederation-mac.zip`](../../releases/download/${{ github.ref_name }}/AgentFederation-mac.zip) — unzip, right-click → Open |
            | Windows | [`AgentFederation-win.zip`](../../releases/download/${{ github.ref_name }}/AgentFederation-win.zip) — unzip, run the `.exe` |

            The setup app registers your device, downloads the MCP server, and configures Claude Code or Claude Desktop automatically. No terminal needed.

            ### Advanced / server binaries

            | Platform | Relay (server) | CLI | MCP Server |
            |---|---|---|---|
            | Windows x64 | `federation-relay-win-x64.zip` | `federation-win-x64.zip` | `federation-mcp-win-x64.zip` |
            | Windows ARM64 | `federation-relay-win-arm64.zip` | `federation-win-arm64.zip` | `federation-mcp-win-arm64.zip` |
            | macOS Intel | `federation-relay-osx-x64.zip` | `federation-osx-x64.zip` | `federation-mcp-osx-x64.zip` |
            | macOS Apple Silicon | `federation-relay-osx-arm64.zip` | `federation-osx-arm64.zip` | `federation-mcp-osx-arm64.zip` |
            | Linux x64 | `federation-relay-linux-x64.zip` | `federation-linux-x64.zip` | `federation-mcp-linux-x64.zip` |
            | Linux ARM64 | `federation-relay-linux-arm64.zip` | `federation-linux-arm64.zip` | `federation-mcp-linux-arm64.zip` |

            > **No .NET installation required.** All binaries are self-contained.
